name: Build SHAKO Assistant

on:
  push:
    branches:
      - shako-assistant-build-20260828

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          rm -rf shako_build shako_project.zip clean.b64
          tr -cd 'A-Za-z0-9+/=' < shako_project.b64 > clean.b64
          python3 - <<'PY'
          import base64
          s=open('clean.b64','rb').read()
          s += b'=' * ((4-len(s)%4)%4)
          open('shako_project.zip','wb').write(base64.b64decode(s, validate=False))
          PY
          unzip -t shako_project.zip
          mkdir shako_build
          unzip -q shako_project.zip -d shako_build

      - name: Build debug APK
        working-directory: shako_build
        run: gradle assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          test -f shako_build/app/build/outputs/apk/debug/app-debug.apk
          cp shako_build/app/build/outputs/apk/debug/app-debug.apk SHAKO_WITH_ASSISTANT_v0_3.apk
          unzip -t SHAKO_WITH_ASSISTANT_v0_3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAKO_WITH_ASSISTANT_v0_3
          path: SHAKO_WITH_ASSISTANT_v0_3.apk
          if-no-files-found: error
