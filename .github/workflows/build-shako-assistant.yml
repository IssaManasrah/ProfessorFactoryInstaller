name: Build SHAKO Assistant

on:
  push:
    branches:
      - shako-assistant-build-20260828

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          rm -rf shako_build
          mkdir shako_build
          unzip -q shako_project.zip -d shako_build

      - name: Build debug APK
        working-directory: shako_build
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp shako_build/app/build/outputs/apk/debug/app-debug.apk SHAKO_WITH_ASSISTANT_v0_3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAKO_WITH_ASSISTANT_v0_3
          path: SHAKO_WITH_ASSISTANT_v0_3.apk
