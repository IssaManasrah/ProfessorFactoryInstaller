name: Haha Hydra source check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact Hydra source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="fd60d7b823825e8f37c3b834861886609fce7c23328073ab533d0cd3973bdc9b"
          URL="https://professorsat.com/store/models/Big%20Boss%20Ai%20Max/Hydra.apk"
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 "$URL" -o Hydra.apk
          h=$(sha256sum Hydra.apk | awk '{print $1}')
          s=$(stat -c%s Hydra.apk)
          echo "Downloaded size=$s sha256=$h"
          test "$h" = "$EXPECTED"
          echo "MATCH_URL=$URL" | tee source-result.txt
      - name: Upload exact Hydra APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-exact-source
          path: Hydra.apk
          if-no-files-found: error
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haha-source-check
          path: source-result.txt
          if-no-files-found: ignore
