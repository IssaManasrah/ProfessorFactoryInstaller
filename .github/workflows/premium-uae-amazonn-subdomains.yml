name: Premium UAE Amazonn Subdomains
on:
  push:
    branches: [premium-uae-v8-lab]
    paths: ['.github/workflows/premium-uae-amazonn-subdomains.yml']
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe likely amazonn.app subdomains
        shell: bash
        run: |
          set -u
          mkdir -p out
          subs=(api app uae gplus plus v12 premium premiumuae server main panel backend stream live media cdn)
          printf 'host\tdns\tget_status\tpost_status\tget_body\tpost_body\n' > out/subdomains.tsv
          for s in "${subs[@]}"; do
            h="$s.amazonn.app"
            dns=$(getent ahostsv4 "$h" | awk 'NR==1{print $1}')
            [ -n "$dns" ] || { printf '%s\t-\t-\t-\t-\t-\n' "$h" >> out/subdomains.tsv; continue; }
            gb=$(mktemp); pb=$(mktemp)
            gc=$(curl -k -sS --max-time 4 -o "$gb" -w '%{http_code}' "https://$h/V12/GPLUS-API.php" 2>/dev/null || echo ERR)
            pc=$(curl -k -sS --max-time 4 -X POST -d '' -o "$pb" -w '%{http_code}' "https://$h/V12/GPLUS-API.php" 2>/dev/null || echo ERR)
            gp=$(tr '\n\r\t' '   ' < "$gb" | head -c 120 | sed 's/  */ /g')
            pp=$(tr '\n\r\t' '   ' < "$pb" | head -c 120 | sed 's/  */ /g')
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$h" "$dns" "$gc" "$pc" "$gp" "$pp" >> out/subdomains.tsv
            rm -f "$gb" "$pb"
          done
          cat out/subdomains.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: Premium-UAE-Amazonn-Subdomains
          path: out/
          retention-days: 7
