name: Haha Hydra inspect

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact Hydra
        shell: bash
        run: |
          set -euo pipefail
          URL="https://professorsat.com/store/models/Big%20Boss%20Ai%20Max/Hydra.apk"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
          curl -fL -A "$UA" -e "https://professorsat.com/" "$URL" -o Hydra.apk
          test "$(sha256sum Hydra.apk | awk '{print $1}')" = "fd60d7b823825e8f37c3b834861886609fce7c23328073ab533d0cd3973bdc9b"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download apktool
        shell: bash
        run: curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
      - name: Decode and inspect targeted code
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f Hydra.apk -o decoded >/dev/null
          echo '===== NativeConfig 1-560 ====='
          sed -n '1,560p' decoded/smali/com/syria/hydra/utils/NativeConfig.smali
          echo '===== FirebaseConfigManager 100-520 ====='
          sed -n '100,520p' decoded/smali/com/syria/hydra/utils/FirebaseConfigManager.smali
          echo '===== IntroViewModel 1750-1930 ====='
          sed -n '1750,1930p' decoded/smali/com/syria/hydra/ui/intro/IntroViewModel.smali
          echo '===== Activation/API candidates ====='
          grep -RInaE 'API-V6APK|makeurownsite|activation|Activation|active|serial|player_api|CUSTOM_API_URL|encrypted_string_domains|encrypted_string_vpn|2344|background|Glide|decrypt|native' decoded/smali/com/syria/hydra | head -n 1200 || true
          echo '===== app_name resources ====='
          grep -RIna '<string name="app_name"' decoded/res/values* 2>/dev/null || true
          echo '===== native ABI list ====='
          find decoded/lib -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort | head -n 300 || true
          tar -czf hydra-targeted.tgz \
            decoded/AndroidManifest.xml decoded/apktool.yml \
            decoded/smali/com/syria/hydra/utils/NativeConfig.smali \
            decoded/smali/com/syria/hydra/utils/FirebaseConfigManager.smali \
            decoded/smali/com/syria/hydra/ui/intro/IntroViewModel.smali \
            decoded/res/values/strings.xml
      - name: Upload targeted inspect files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-targeted-inspect
          path: hydra-targeted.tgz
          if-no-files-found: ignore
