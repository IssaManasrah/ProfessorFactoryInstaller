name: Android TV 12 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-tv-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Build debug APK with Android Gradle Plugin
        run: gradle --no-daemon :app:assembleDebug

      - name: Android TV 12 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash .github/scripts/tv-smoke.sh

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProfessorInstaller-AndroidTV12-tested-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload TV smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProfessorInstaller-AndroidTV12-smoke-evidence
          path: |
            professor-tv-home.png
            emulator-logcat.txt
            emulator-logcat-after-dpad.txt
            window.xml
            install-result.txt
            start-result.txt
            package-manager-logcat.txt
          if-no-files-found: ignore
