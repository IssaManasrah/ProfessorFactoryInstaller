name: Android TV 12 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-tv-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Build debug APK with Android Gradle Plugin
        run: gradle --no-daemon :app:assembleDebug

      - name: Android TV 12 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash .github/scripts/tv-smoke.sh

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProfessorInstaller-AndroidTV12-tested-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish tested Auto Click APK to validation branch
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'build/auto-click-3.1.0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ProfessorInstaller_3.1.0_AUTO_CLICK.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ProfessorInstaller_3.1.0_AUTO_CLICK.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add Android TV validated Auto Click APK"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload TV smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProfessorInstaller-AndroidTV12-smoke-evidence
          path: |
            professor-tv-home.png
            emulator-logcat.txt
            emulator-logcat-after-dpad.txt
            window.xml
            install-result.txt
            start-result.txt
            package-manager-logcat.txt
          if-no-files-found: ignore
