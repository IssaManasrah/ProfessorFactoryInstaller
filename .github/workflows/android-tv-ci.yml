name: Android TV CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-tv-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with Android Gradle Plugin
        run: gradle --no-daemon :app:assembleDebug

      - name: Install Android TV system image
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          AVDMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "emulator" "system-images;android-34;android-tv;x86"
          echo no | "$AVDMANAGER" create avd --force -n professor_tv --package "system-images;android-34;android-tv;x86" --device "tv_1080p"

      - name: Boot Android TV and smoke test app
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE="com.shaikhalkar.professorinstaller.debug"
          COMPONENT="$PACKAGE/com.shaikhalkar.professorinstaller.MainActivity"

          "$ADB" kill-server || true
          "$ADB" start-server
          "$EMULATOR" -avd professor_tv -port 5554 -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > emulator-console.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 180); do
            STATE=$("$ADB" -s emulator-5554 get-state 2>/dev/null || true)
            BOOT=$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then
              break
            fi
            sleep 2
          done

          STATE=$("$ADB" -s emulator-5554 get-state 2>/dev/null || true)
          BOOT=$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
          if [ "$STATE" != "device" ] || [ "$BOOT" != "1" ]; then
            echo "Android TV emulator failed to become ready"
            "$ADB" devices -l || true
            tail -n 300 emulator-console.log || true
            exit 1
          fi

          # Avoid streamed-install transport issues and capture PackageManager's real result.
          "$ADB" -s emulator-5554 logcat -c
          "$ADB" -s emulator-5554 push "$APK" /data/local/tmp/professor-installer.apk
          set +e
          INSTALL_OUTPUT=$("$ADB" -s emulator-5554 shell pm install -r /data/local/tmp/professor-installer.apk 2>&1)
          INSTALL_RC=$?
          set -e
          printf '%s\n' "$INSTALL_OUTPUT" | tee install-result.txt
          "$ADB" -s emulator-5554 logcat -b all -d > package-manager-logcat.txt || true
          if [ $INSTALL_RC -ne 0 ] || ! printf '%s\n' "$INSTALL_OUTPUT" | grep -q '^Success'; then
            echo "PackageManager install failed (rc=$INSTALL_RC)"
            grep -Ei "PackageManager|PackageInstaller|INSTALL_|parse|signature|permission|professor" package-manager-logcat.txt | tail -n 300 || true
            exit 1
          fi

          "$ADB" -s emulator-5554 shell am force-stop "$PACKAGE"
          "$ADB" -s emulator-5554 logcat -c
          "$ADB" -s emulator-5554 shell am start -W -n "$COMPONENT"
          sleep 5

          PID=$("$ADB" -s emulator-5554 shell pidof "$PACKAGE" | tr -d '\r' || true)
          "$ADB" -s emulator-5554 logcat -b all -d > emulator-logcat.txt || true
          if [ -z "$PID" ]; then
            echo "Professor Installer crashed or failed to launch"
            tail -n 300 emulator-logcat.txt || true
            exit 1
          fi

          "$ADB" -s emulator-5554 shell uiautomator dump /sdcard/window.xml || true
          "$ADB" -s emulator-5554 pull /sdcard/window.xml window.xml || true
          "$ADB" -s emulator-5554 exec-out screencap -p > professor-tv-home.png

          grep -q "برمجة الأجهزة" window.xml
          grep -q "تصفح التطبيقات" window.xml
          grep -q "الدعم" window.xml

          "$ADB" -s emulator-5554 shell input keyevent KEYCODE_DPAD_RIGHT
          "$ADB" -s emulator-5554 shell input keyevent KEYCODE_DPAD_LEFT
          sleep 1

          if grep -E "FATAL EXCEPTION: main|Process: $PACKAGE.*FATAL" emulator-logcat.txt; then
            echo "Crash detected in emulator log"
            exit 1
          fi

          echo "ANDROID_TV_SMOKE_TEST=PASS"

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProfessorInstaller-TV-tested-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload TV smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProfessorInstaller-TV-smoke-evidence
          path: |
            professor-tv-home.png
            emulator-logcat.txt
            emulator-console.log
            window.xml
            install-result.txt
            package-manager-logcat.txt
          if-no-files-found: ignore
