name: Premium UAE V7 Analysis

on:
  push:
    branches: [premium-uae-v7-lab]
    paths:
      - '.github/workflows/premium-uae-v7-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and decode UAE APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p lab/tools lab/out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          curl -fL --retry 3 -A "$UA" -H 'Accept: */*' -e 'https://professorsat.com/' -o lab/premium-UAE.apk 'https://professorsat.com/store/models/UAE%20Apps/premium-UAE.apk'
          curl -fL --retry 3 -o lab/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          java -jar lab/tools/apktool.jar d -f lab/premium-UAE.apk -o lab/decoded-uae

      - name: Apply V6 baseline
        shell: bash
        run: |
          set -euxo pipefail
          python3 premium-uae-lab/patch_uae.py lab/decoded-uae
          python3 premium-uae-lab/fix_ranges.py lab/decoded-uae
          cat premium-uae-lab/vnext_parts/part00 premium-uae-lab/vnext_parts/part01 premium-uae-lab/vnext_parts/part02 premium-uae-lab/vnext_parts/part03 premium-uae-lab/vnext_parts/part04a premium-uae-lab/vnext_parts/part04b0 premium-uae-lab/vnext_parts/part04b1 premium-uae-lab/vnext_parts/part04b2 premium-uae-lab/vnext_parts/part05 > lab/patch_vnext.py.gz.b64
          base64 -d lab/patch_vnext.py.gz.b64 | gzip -d > lab/patch_vnext.py
          python3 lab/patch_vnext.py lab/decoded-uae
          base64 -d premium-uae-lab/v5/patch_v5.py.gz.b64 | gzip -d > lab/patch_v5.py
          python3 lab/patch_v5.py lab/decoded-uae
          base64 -d premium-uae-lab/v6/patch_v6.py.gz.b64 | gzip -d > lab/patch_v6.py
          python3 lab/patch_v6.py lab/decoded-uae

      - name: Collect V7 targets
        shell: bash
        run: |
          set -euxo pipefail
          APP=lab/decoded-uae/smali/com/mbm_soft/aldahyaplay
          cp lab/patch_vnext.py lab/out/patch_vnext.py
          cp lab/patch_v5.py lab/out/patch_v5.py
          cp lab/patch_v6.py lab/out/patch_v6.py
          grep -R -n -E 'ResumeStore|ResumePrompt|searchToken|filterSeries|filterMovies|currentPosition|seekTo|SharedPreferences|watched_series_|watched_movie_' "$APP" > lab/out/target-grep.txt || true
          tar -czf lab/out/v6-smali-targets.tar.gz \
            "$APP/ui/movies" \
            "$APP/ui/series" \
            "$APP/ui/movie_info" \
            "$APP/ui/series_info" \
            "$APP/ui/vod_exo" \
            "$APP/ui/vod_vlc" \
            "$APP/utils/ResumeStore.smali" \
            "$APP/utils/ResumePrompt.smali" \
            "$APP/utils/ResumePrompt$ExoContinue.smali" \
            "$APP/utils/ResumePrompt$ExoRestart.smali" \
            "$APP/utils/ResumePrompt$VlcContinue.smali" \
            "$APP/utils/ResumePrompt$VlcRestart.smali" \
            "$APP/adapter/MovieAdapter.smali" \
            "$APP/adapter/SeriesAdapter.smali" \
            "$APP/adapter/EpisodeAdapter.smali" \
            lab/decoded-uae/smali/z6/f.smali \
            lab/decoded-uae/smali/z6/j.smali \
            lab/decoded-uae/smali/w6/f.smali \
            lab/decoded-uae/smali/p7/m.smali \
            lab/decoded-uae/smali/q7/c.smali

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: Premium-UAE-V7-Analysis-2
          path: |
            lab/out/patch_vnext.py
            lab/out/patch_v5.py
            lab/out/patch_v6.py
            lab/out/target-grep.txt
            lab/out/v6-smali-targets.tar.gz
          retention-days: 7
