name: Premium UAE Lab

on:
  push:
    branches: [premium-uae-lab]
    paths:
      - '.github/workflows/premium-uae-lab.yml'
      - 'premium-uae-lab/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APKs and tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p lab/tools lab/apks lab/out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          curl -fL --retry 3 -A "$UA" -H 'Accept: */*' -e 'https://professorsat.com/' -o lab/apks/premium-UAE.apk 'https://professorsat.com/store/models/UAE%20Apps/premium-UAE.apk'
          curl -fL --retry 3 -A "$UA" -H 'Accept: */*' -e 'https://professorsat.com/' -o lab/apks/Premium.apk 'https://professorsat.com/store/models/Big%20Boss%20Ai%20Max/Premium.apk'
          curl -fL --retry 3 -o lab/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          curl -fL --retry 3 -o lab/tools/jadx.zip 'https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip'
          unzip -q lab/tools/jadx.zip -d lab/tools/jadx
          chmod +x lab/tools/jadx/bin/jadx
          sha256sum lab/apks/*.apk lab/tools/apktool.jar lab/tools/jadx.zip | tee lab/out/SHA256SUMS.txt

      - name: Decode both APKs
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar d -f lab/apks/premium-UAE.apk -o lab/decoded-uae
          java -jar lab/tools/apktool.jar d -f lab/apks/Premium.apk -o lab/decoded-premium

      - name: Decompile comparison with JADX
        shell: bash
        run: |
          set -euxo pipefail
          lab/tools/jadx/bin/jadx --show-bad-code -d lab/jadx-uae lab/apks/premium-UAE.apk || true
          lab/tools/jadx/bin/jadx --show-bad-code -d lab/jadx-premium lab/apks/Premium.apk || true
          python3 premium-uae-lab/analyze.py --uae-smali lab/decoded-uae --premium-smali lab/decoded-premium --uae-java lab/jadx-uae --premium-java lab/jadx-premium --out lab/out

      - name: Apply UAE vNext patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 premium-uae-lab/patch_uae.py lab/decoded-uae | tee lab/out/patch-result.txt
          python3 premium-uae-lab/fix_ranges.py lab/decoded-uae | tee -a lab/out/patch-result.txt
          cat premium-uae-lab/vnext_parts/part00 premium-uae-lab/vnext_parts/part01 premium-uae-lab/vnext_parts/part02 premium-uae-lab/vnext_parts/part03 premium-uae-lab/vnext_parts/part04a premium-uae-lab/vnext_parts/part04b0 premium-uae-lab/vnext_parts/part04b1 premium-uae-lab/vnext_parts/part04b2 premium-uae-lab/vnext_parts/part05 > lab/patch_vnext.py.gz.b64
          test "$(wc -c < lab/patch_vnext.py.gz.b64)" -eq 9176
          base64 -d lab/patch_vnext.py.gz.b64 | gzip -d > lab/patch_vnext.py
          python3 -m py_compile lab/patch_vnext.py
          python3 lab/patch_vnext.py lab/decoded-uae | tee -a lab/out/patch-result.txt
          grep -R 'search_movies' lab/decoded-uae/smali/com/mbm_soft/aldahyaplay/ui/movies > lab/out/movie-search-check.txt
          grep -R 'search_series' lab/decoded-uae/smali/com/mbm_soft/aldahyaplay/ui/series > lab/out/series-search-check.txt
          grep -R 'MY LIST' lab/decoded-uae/smali/com/mbm_soft/aldahyaplay/ui/movies lab/decoded-uae/smali/com/mbm_soft/aldahyaplay/ui/series > lab/out/mylist-check.txt
          grep -R '✓ شاهدت' lab/decoded-uae/smali/com/mbm_soft/aldahyaplay lab/decoded-uae/res/layout/movie_item.xml > lab/out/watched-check.txt
          grep -R 'هل تريد استكمال المشاهدة أو البدء من جديد؟' lab/decoded-uae/smali/com/mbm_soft/aldahyaplay/utils > lab/out/resume-prompt-check.txt
          test -f lab/decoded-uae/smali/com/mbm_soft/aldahyaplay/utils/ResumePrompt.smali
          test -f lab/decoded-uae/smali/com/mbm_soft/aldahyaplay/utils/ResumeStore.smali

      - name: Rebuild patched UAE APK
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar b lab/decoded-uae -o lab/out/Premium_UAE_Enhanced_unsigned.apk
          unzip -t lab/out/Premium_UAE_Enhanced_unsigned.apk | tee lab/out/rebuild-zip-test.txt

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore lab/out/lab.keystore -storepass android -keypass android -alias premiumuae -dname 'CN=Premium UAE Lab,O=Professor,C=JO' -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f 4 lab/out/Premium_UAE_Enhanced_unsigned.apk lab/out/Premium_UAE_Enhanced_aligned.apk
          "$BT/apksigner" sign --ks lab/out/lab.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias premiumuae --out lab/out/Premium_UAE_Enhanced.apk lab/out/Premium_UAE_Enhanced_aligned.apk
          "$BT/apksigner" verify --verbose --print-certs lab/out/Premium_UAE_Enhanced.apk | tee lab/out/apksigner-verify.txt

      - name: Emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r lab/out/Premium_UAE_Enhanced.apk
            adb logcat -c
            adb shell monkey -p com.mbm_soft.aldahyaplay -c android.intent.category.LAUNCHER 1 || true
            sleep 12
            adb shell pidof com.mbm_soft.aldahyaplay > lab/out/emulator-pid.txt || true
            test -s lab/out/emulator-pid.txt
            adb logcat -d > lab/out/emulator-logcat.txt
            grep -A12 -B4 -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.mbm_soft\.aldahyaplay' lab/out/emulator-logcat.txt > lab/out/fatal-check.txt || true
            test ! -s lab/out/fatal-check.txt
            echo 'EMULATOR_SMOKE_OK' > lab/out/emulator-result.txt

      - name: Upload enhanced APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-UAE-Enhanced-vNext
          path: |
            lab/out/Premium_UAE_Enhanced.apk
            lab/out/patch-result.txt
            lab/out/apksigner-verify.txt
            lab/out/emulator-result.txt
            lab/out/emulator-pid.txt
            lab/out/emulator-logcat.txt
            lab/out/fatal-check.txt
            lab/out/movie-search-check.txt
            lab/out/series-search-check.txt
            lab/out/mylist-check.txt
            lab/out/watched-check.txt
            lab/out/resume-prompt-check.txt
            lab/out/REPORT.md
            lab/out/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
