name: Premium UAE V8.1 Search Restore

on:
  push:
    branches: [premium-uae-v8-lab]
    paths: ['.github/workflows/premium-uae-v81.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download V7 and V8 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p lab/v7 lab/v8 lab/tools lab/out
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -o lab/v7.zip 'https://api.github.com/repos/IssaManasrah/ProfessorFactoryInstaller/actions/artifacts/9253073968/zip'
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -o lab/v8.zip 'https://api.github.com/repos/IssaManasrah/ProfessorFactoryInstaller/actions/artifacts/9253511622/zip'
          unzip -q lab/v7.zip -d lab/v7
          unzip -q lab/v8.zip -d lab/v8
          test -f lab/v7/Premium_UAE_V7.apk
          test -f lab/v8/Premium_UAE_V8.apk
          curl -fL --retry 3 -o lab/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'

      - name: Decode V7 and V8
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar d -f lab/v7/Premium_UAE_V7.apk -o lab/v7-dec
          java -jar lab/tools/apktool.jar d -f lab/v8/Premium_UAE_V8.apk -o lab/v81-dec

      - name: Restore only V7 search ViewModels
        shell: bash
        run: |
          set -euxo pipefail
          BASE=smali/com/mbm_soft/aldahyaplay/ui
          cp lab/v7-dec/$BASE/movies/d.smali lab/v81-dec/$BASE/movies/d.smali
          cp lab/v7-dec/$BASE/series/d.smali lab/v81-dec/$BASE/series/d.smali
          sha256sum lab/v7-dec/$BASE/movies/d.smali lab/v81-dec/$BASE/movies/d.smali | tee lab/out/movies-search-sha.txt
          sha256sum lab/v7-dec/$BASE/series/d.smali lab/v81-dec/$BASE/series/d.smali | tee lab/out/series-search-sha.txt
          cmp lab/v7-dec/$BASE/movies/d.smali lab/v81-dec/$BASE/movies/d.smali
          cmp lab/v7-dec/$BASE/series/d.smali lab/v81-dec/$BASE/series/d.smali
          grep -q 'search_movies' lab/v81-dec/$BASE/movies/d.smali
          grep -q 'search_series' lab/v81-dec/$BASE/series/d.smali
          grep -q 'searchToken' lab/v81-dec/$BASE/movies/d.smali
          grep -q 'searchToken' lab/v81-dec/$BASE/series/d.smali
          echo SEARCH_RESTORE_V7_EXACT_OK | tee lab/out/search-restore.txt

      - name: Verify V8-only features remain
        shell: bash
        run: |
          set -euxo pipefail
          APP=lab/v81-dec/smali/com/mbm_soft/aldahyaplay
          grep -R -q 'last_movie_' "$APP/utils"
          grep -R -q 'last_series_' "$APP/utils"
          grep -R -q 'MovieRecentComparator' "$APP/utils"
          grep -R -q 'SeriesRecentComparator' "$APP/utils"
          grep -q 'setNextFocusRightId' "$APP/utils/ResumePrompt.smali"
          grep -q 'setNextFocusLeftId' "$APP/utils/ResumePrompt.smali"
          echo V8_FEATURES_PRESERVED_OK | tee lab/out/v8-features.txt

      - name: Rebuild and sign V8.1
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar b lab/v81-dec -o lab/out/Premium_UAE_V81_unsigned.apk
          unzip -t lab/out/Premium_UAE_V81_unsigned.apk > lab/out/zip-test.txt
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore lab/out/v81.keystore -storepass android -keypass android -alias v81 -dname 'CN=Premium UAE V8.1,O=Professor,C=JO' -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f 4 lab/out/Premium_UAE_V81_unsigned.apk lab/out/Premium_UAE_V81_aligned.apk
          "$BT/apksigner" sign --ks lab/out/v81.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias v81 --out lab/out/Premium_UAE_V81.apk lab/out/Premium_UAE_V81_aligned.apk
          "$BT/apksigner" verify --verbose --print-certs lab/out/Premium_UAE_V81.apk | tee lab/out/signature.txt

      - name: Android 12 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb wait-for-device
            sleep 25
            adb shell service check package | grep -qi found
            adb push lab/out/Premium_UAE_V81.apk /data/local/tmp/v81.apk
            adb shell pm install -r /data/local/tmp/v81.apk || (sleep 15; adb shell pm install -r /data/local/tmp/v81.apk)
            adb logcat -c
            adb shell monkey -p com.mbm_soft.aldahyaplay -c android.intent.category.LAUNCHER 1 || true
            sleep 10
            adb shell pidof com.mbm_soft.aldahyaplay > lab/out/pid.txt || true
            test -s lab/out/pid.txt
            adb logcat -d > lab/out/logcat.txt
            if grep -A8 -B3 'FATAL EXCEPTION' lab/out/logcat.txt | grep -q 'com.mbm_soft.aldahyaplay'; then exit 1; fi
            echo ANDROID12_V81_SMOKE_OK > lab/out/emulator-result.txt

      - name: Upload V8.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-UAE-Enhanced-V8.1
          path: |
            lab/out/Premium_UAE_V81.apk
            lab/out/search-restore.txt
            lab/out/v8-features.txt
            lab/out/movies-search-sha.txt
            lab/out/series-search-sha.txt
            lab/out/signature.txt
            lab/out/zip-test.txt
            lab/out/emulator-result.txt
            lab/out/pid.txt
            lab/out/logcat.txt
          if-no-files-found: warn
          retention-days: 7
