name: Haha VIP IPTV APK Emulator Test

on:
  push:
    branches: [ haha-vip-ci-20260815 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haha-vip-ci-20260815

      - name: Download public candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -A 'Mozilla/5.0' -fL --connect-timeout 15 --max-time 180 --retry 2 'https://shaikhalkar.com/hydra2026.apk' -o public.apk
          ls -lh public.apk
          sha256sum public.apk
          file public.apk
          unzip -t public.apk | tail -5

      - name: Inspect package, dex and resources
        shell: bash
        run: |
          set -euxo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          echo "AAPT=$AAPT"
          "$AAPT" dump badging public.apk | head -40
          echo '=== APK entries ==='
          unzip -l public.apk | sed -n '1,120p'
          echo '=== Key entry sizes/hashes ==='
          python3 - <<'PY'
          import zipfile,hashlib
          z=zipfile.ZipFile('public.apk')
          for n in z.namelist():
              if n in ('AndroidManifest.xml','resources.arsc','classes.dex','classes2.dex','classes3.dex') or n.startswith('lib/') or n.startswith('assets/'):
                  d=z.read(n)
                  print(len(d),hashlib.sha256(d).hexdigest(),n)
          PY
          echo '=== Search Hydra markers in dex ==='
          unzip -p public.apk classes.dex > public-classes.dex
          strings -a public-classes.dex | grep -E 'com\.syria\.hydra|encrypted_string_domains|CUSTOM_API_URL|makeurownsite|ultracloudcdn|tatbatcathatmat|API-V6APK|f@j3r_H1dr' | head -100 || true
