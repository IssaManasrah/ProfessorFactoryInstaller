name: Haha VIP IPTV APK Emulator Test

on:
  push:
    branches: [ haha-vip-ci-20260815 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-and-emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: haha-vip-ci-20260815

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Download exact Hydra original
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='fd60d7b823825e8f37c3b834861886609fce7c23328073ab533d0cd3973bdc9b'
          URLS=(
            'https://professorsat.com/hydra2026.apk'
            'https://www.professorsat.com/hydra2026.apk'
            'https://shaikhalkar.com/hydra2026.apk'
            'https://www.shaikhalkar.com/hydra2026.apk'
          )
          FOUND=0
          for u in "${URLS[@]}"; do
            echo "Trying $u"
            rm -f Hydra.apk
            if curl -A 'Mozilla/5.0' -fL --connect-timeout 15 --max-time 120 --retry 2 "$u" -o Hydra.apk; then
              GOT=$(sha256sum Hydra.apk | awk '{print $1}')
              echo "SHA256=$GOT"
              if [ "$GOT" = "$EXPECTED" ]; then
                echo "Exact uploaded Hydra matched: $u"
                FOUND=1
                break
              fi
            fi
          done
          if [ "$FOUND" != 1 ]; then
            echo 'Could not obtain the exact uploaded Hydra.apk by SHA-256.'
            exit 22
          fi

      - name: Download Apktool and Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' -o apktool.jar
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          java -jar apktool.jar --version

      - name: Decode original APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf hydra-src
          java -jar apktool.jar d -f Hydra.apk -o hydra-src

      - name: Patch API endpoints, package, name and icon
        shell: bash
        env:
          ICON_B64: ''
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, base64, xml.etree.ElementTree as ET

          root_dir = Path('hydra-src')
          replacements = {
              'DjQeQ0hwZ0QIBjJMMF8MB1cXSSUdGkJfCgoG': 'DjQeQ0hwZ1AKFm5FMltQHktaTjJcDBcKAAoG',
              'DjQeQ0hwZ0QIBjJMMF8MB1cXSSUdGkJfCgoGSTgHXwYpZkEMAg..': 'DjQeQ0hwZ1AKFm5FMltQHktaTjJcDBcKAAoGSTgHXwYpZkEMAg..',
              'DjQeQ0hwZ1wFGSVYIVwUHEAdWS4dGkJfH1NGFm8rYztyHgclIgsDI1sT': 'DjQeQ0hwZ1AKFm5FMltQHktaTjJcDAJzYHkZLiEEVgVxOFkU',
              'DjQeQwFlZx4QEzRPMkcAE0ccTD9eGFkcSEtMSXJZB0ZxIkED': 'DjQeQ0hwZ1gJFW1FMlsCG0MAW2VdHFkdUUJdSygLWxNyJlQTEzBGfAFQRgdaRztU',
          }
          counts = {k: 0 for k in replacements}
          for p in list(root_dir.glob('smali*/**/*.smali')):
              s = p.read_text(errors='ignore')
              orig = s
              for old, new in replacements.items():
                  c = s.count(old)
                  if c:
                      counts[old] += c
                      s = s.replace(old, new)
              if s != orig:
                  p.write_text(s)
          print('Endpoint replacement counts:', counts)
          if any(v != 1 for v in counts.values()):
              raise SystemExit(f'Unexpected endpoint occurrence count: {counts}')

          manifest = root_dir / 'AndroidManifest.xml'
          A = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          r = tree.getroot()
          r.set('package', 'com.haha.viptv2')
          app = r.find('application')
          if app is None:
              raise SystemExit('application element missing')
          app.set(A+'label', 'Haha VIP IPTV')
          for el in r.iter():
              for key in (A+'authorities', A+'permission'):
                  val = el.get(key)
                  if val and 'com.syria.hydra' in val:
                      el.set(key, val.replace('com.syria.hydra', 'com.haha.viptv2'))
              if el.tag in ('permission', 'uses-permission'):
                  key = A+'name'
                  val = el.get(key)
                  if val and val.startswith('com.syria.hydra.'):
                      el.set(key, val.replace('com.syria.hydra', 'com.haha.viptv2', 1))
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          Path('/tmp/haha-icon.jpg').write_bytes(base64.b64decode(os.environ['ICON_B64']))
          PY

          python3 -m pip -q install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open('/tmp/haha-icon.jpg').convert('RGB')

          def square(path, size):
              p=Path(path)
              if not p.exists(): return
              im=src.copy(); im.thumbnail((size,size), Image.Resampling.LANCZOS)
              bg=Image.new('RGB',(size,size),'white')
              bg.paste(im,((size-im.width)//2,(size-im.height)//2))
              bg.save(p,'PNG',optimize=True)

          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for dens,sz in sizes.items():
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  square(f'hydra-src/res/mipmap-{dens}/{name}', sz)
          square('hydra-src/res/drawable/app_logo.png', 512)

          for name in ('ic_banner.png','ic_banner_foreground.png'):
              p=Path('hydra-src/res/mipmap-xhdpi')/name
              if p.exists():
                  logo=src.copy(); logo.thumbnail((150,150),Image.Resampling.LANCZOS)
                  bg=Image.new('RGB',(320,180),'white')
                  bg.paste(logo,((320-logo.width)//2,(180-logo.height)//2))
                  bg.save(p,'PNG',optimize=True)
          PY

          grep -R -n 'CUSTOM_API_URL' hydra-src/smali* | head -50 | tee custom-api-url-locations.txt || true

      - name: Rebuild APK cleanly from Smali/resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          java -jar apktool.jar b hydra-src -o dist/Haha_VIP_IPTV_unsigned.apk

      - name: Zipalign and sign with Android apksigner
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 dist/Haha_VIP_IPTV_unsigned.apk dist/Haha_VIP_IPTV_aligned.apk
          keytool -genkeypair -noprompt -keystore haha-ci.keystore -storepass android -keypass android -alias haha -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Haha VIP IPTV CI,O=ShaikhAlKar,C=JO'
          "$BT/apksigner" sign --ks haha-ci.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias haha --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out dist/Haha_VIP_IPTV_GITHUB_TESTED.apk dist/Haha_VIP_IPTV_aligned.apk
          "$BT/zipalign" -c -p 4 dist/Haha_VIP_IPTV_GITHUB_TESTED.apk
          "$BT/apksigner" verify --verbose --print-certs dist/Haha_VIP_IPTV_GITHUB_TESTED.apk | tee signature-verification.txt
          "$BT/aapt" dump badging dist/Haha_VIP_IPTV_GITHUB_TESTED.apk | tee apk-badging.txt
          grep -q "package: name='com.haha.viptv2'" apk-badging.txt
          grep -q "application-label:'Haha VIP IPTV'" apk-badging.txt
          sha256sum dist/Haha_VIP_IPTV_GITHUB_TESTED.apk | tee final-sha256.txt

      - name: Android TV 12 emulator install/launch/crash test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            set -euxo pipefail
            APK='dist/Haha_VIP_IPTV_GITHUB_TESTED.apk'
            PACKAGE='com.haha.viptv2'
            adb wait-for-device
            adb shell input keyevent 82 || true
            adb logcat -c
            set +e
            adb install --no-streaming -r "$APK" 2>&1 | tee install-result.txt
            RC=${PIPESTATUS[0]}
            set -e
            test "$RC" -eq 0
            grep -q 'Success' install-result.txt
            adb shell dumpsys package "$PACKAGE" > package-dump.txt
            grep -q "$PACKAGE" package-dump.txt

            RESOLVED=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER "$PACKAGE" 2>/dev/null | tr -d '\r' | tail -1 || true)
            if [ -z "$RESOLVED" ] || echo "$RESOLVED" | grep -qi 'No activity'; then
              RESOLVED=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE" 2>/dev/null | tr -d '\r' | tail -1 || true)
            fi
            echo "Resolved activity: $RESOLVED" | tee start-result.txt
            if [ -z "$RESOLVED" ] || echo "$RESOLVED" | grep -qi 'No activity'; then
              adb shell monkey -p "$PACKAGE" 1 | tee -a start-result.txt
            else
              adb shell am force-stop "$PACKAGE"
              adb shell am start -W -n "$RESOLVED" | tee -a start-result.txt
            fi

            sleep 15
            adb logcat -d -v threadtime > emulator-logcat.txt
            adb shell dumpsys activity activities > activity-dump.txt
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            adb exec-out screencap -p > haha-home.png || true

            if grep -A25 -B5 -E "Process: $PACKAGE|FATAL EXCEPTION" emulator-logcat.txt | grep -q "$PACKAGE"; then
              echo 'Detected fatal crash for Haha VIP IPTV'
              grep -A40 -B10 -E "Process: $PACKAGE|FATAL EXCEPTION" emulator-logcat.txt || true
              exit 31
            fi
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)
            echo "PID after 15 seconds: $PID"
            if [ -z "$PID" ]; then
              echo 'Haha VIP IPTV process is not alive after launch'
              tail -300 emulator-logcat.txt
              exit 32
            fi

            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 5
            adb logcat -d -v threadtime > emulator-logcat-after-dpad.txt
            PID2=$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)
            test -n "$PID2"
            if grep -A25 -B5 -E "Process: $PACKAGE|FATAL EXCEPTION" emulator-logcat-after-dpad.txt | grep -q "$PACKAGE"; then
              echo 'Detected fatal crash after D-pad smoke test'
              exit 33
            fi

      - name: Publish only emulator-passed APK to temporary branch
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/Haha_VIP_IPTV_GITHUB_TESTED.apk final-sha256.txt signature-verification.txt apk-badging.txt
          git commit -m 'Add Android TV emulator-passed Haha VIP IPTV APK'
          git push origin HEAD:haha-vip-ci-20260815

      - name: Upload APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Haha-VIP-IPTV-emulator-test
          path: |
            dist/Haha_VIP_IPTV_GITHUB_TESTED.apk
            install-result.txt
            start-result.txt
            package-dump.txt
            emulator-logcat.txt
            emulator-logcat-after-dpad.txt
            activity-dump.txt
            window.xml
            haha-home.png
            signature-verification.txt
            apk-badging.txt
            final-sha256.txt
            custom-api-url-locations.txt
          if-no-files-found: ignore
