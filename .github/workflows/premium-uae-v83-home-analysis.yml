name: Premium UAE V8.3 Home Analysis
on:
  push:
    branches: [premium-uae-v8-lab]
    paths: ['.github/workflows/premium-uae-v83-home-analysis.yml']
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode exact V8.2 and inspect home
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p lab/src lab/tools lab/out
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -o lab/v82.zip 'https://api.github.com/repos/IssaManasrah/ProfessorFactoryInstaller/actions/artifacts/9260005702/zip'
          unzip -q lab/v82.zip -d lab/src
          APK="$(find lab/src -type f -name '*.apk' | head -1)"
          cp "$APK" lab/v82.apk
          curl -fL --retry 3 -o lab/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          java -jar lab/tools/apktool.jar d -f lab/v82.apk -o lab/decoded
          cp lab/decoded/AndroidManifest.xml lab/out/AndroidManifest.xml
          cp lab/decoded/res/layout/activity_home.xml lab/out/activity_home.xml
          grep -R -n -E 'MAIN|LAUNCHER|setContentView|activity_main|home|dashboard|MainActivity' lab/decoded/AndroidManifest.xml lab/decoded/smali/com/mbm_soft/aldahyaplay/ui > lab/out/home-grep.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: V83-Home-Analysis
          path: lab/out/
          retention-days: 7
