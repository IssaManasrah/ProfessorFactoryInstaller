name: Export Zipalign Lib Direct
on:
  push:
    branches: [ fix/haha-agent-logo-emulator ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Collect dependency
        shell: bash
        run: |
          set -euxo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -f "$BT/lib64/libc++.so"
          mkdir out
          cp "$BT/lib64/libc++.so" out/libc++.so
      - uses: actions/upload-artifact@v4
        with:
          name: zipalign-libcpp-direct
          path: out/libc++.so
          if-no-files-found: error
