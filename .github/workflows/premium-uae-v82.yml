name: Premium UAE V8.2

on:
  push:
    branches: [premium-uae-v8-lab]
    paths:
      - '.github/workflows/premium-uae-v82.yml'
      - 'premium-uae-lab/v82/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact V8.1 and decode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p lab/src lab/tools lab/out
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -o lab/v81.zip 'https://api.github.com/repos/IssaManasrah/ProfessorFactoryInstaller/actions/artifacts/9255161825/zip'
          unzip -q lab/v81.zip -d lab/src
          APK="$(find lab/src -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" lab/v81.apk
          curl -fL --retry 3 -o lab/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          java -jar lab/tools/apktool.jar d -f lab/v81.apk -o lab/decoded

      - name: Apply V8.2
        shell: bash
        run: |
          set -euxo pipefail
          python3 premium-uae-lab/v82/patch_v82.py lab/decoded | tee lab/out/patch-result.txt
          grep -q 'V82_PATCH_OK' lab/out/patch-result.txt

      - name: Verify odd/even search logic and branding
        shell: bash
        run: |
          set -euxo pipefail
          MOV='lab/decoded/smali/com/mbm_soft/aldahyaplay/ui/movies/MoviesActivity$d.smali'
          SER='lab/decoded/smali/com/mbm_soft/aldahyaplay/ui/series/SeriesActivity$d.smali'
          MVM='lab/decoded/smali/com/mbm_soft/aldahyaplay/ui/movies/d.smali'
          SVM='lab/decoded/smali/com/mbm_soft/aldahyaplay/ui/series/d.smali'
          grep -q 'and-int/lit8 v3, v2, 0x1' "$MOV"
          grep -q 'and-int/lit8 v3, v2, 0x1' "$SER"
          grep -q 'SearchFilter;->movies' "$MVM"
          grep -q 'SearchFilter;->series' "$SVM"
          grep -q 'Powered by : Shaikh Alkar' lab/decoded/res/layout/activity_intro.xml
          grep -q 'MovieRecentComparator' lab/decoded/smali/com/mbm_soft/aldahyaplay/utils/MovieRecentComparator.smali
          grep -q 'SeriesRecentComparator' lab/decoded/smali/com/mbm_soft/aldahyaplay/utils/SeriesRecentComparator.smali
          grep -q 'setNextFocusRightId' lab/decoded/smali/com/mbm_soft/aldahyaplay/utils/ResumePrompt.smali
          python3 - <<'PY' | tee lab/out/search-scenarios.txt
          def server_q(q):
              return q[:-1] if len(q) > 1 and len(q) % 2 == 1 else q
          cases = [
              ('ab','ab'),('abc','ab'),('abcd','abcd'),('abcde','abcd'),('abcdef','abcdef'),
              ('المد','المد'),('المدي','المد'),('المدين','المدين'),
          ]
          for q, exp in cases:
              got=server_q(q)
              assert got==exp,(q,got,exp)
              print(f'{q!r} -> server {got!r} -> local filter {q!r}: PASS')
          candidates=['المدينة','المدير','المدرسة','ABC Movie','ABCDE Show']
          def filt(q): return [x for x in candidates if q.lower() in x.lower()]
          assert 'المدينة' in filt('المدي')
          assert 'ABCDE Show' in filt('abcde')
          print('Arabic and English full-query post-filter: PASS')
          PY
          cp lab/decoded/res/layout/activity_intro.xml lab/out/activity_intro_v82.xml

      - name: Rebuild and sign V8.2
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar b lab/decoded -o lab/out/Premium_UAE_V82_unsigned.apk
          unzip -t lab/out/Premium_UAE_V82_unsigned.apk | tee lab/out/zip-test.txt
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore lab/out/v82.keystore -storepass android -keypass android -alias v82 -dname 'CN=Premium UAE V8.2,O=Shaikh Alkar,C=JO' -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f 4 lab/out/Premium_UAE_V82_unsigned.apk lab/out/Premium_UAE_V82_aligned.apk
          "$BT/apksigner" sign --ks lab/out/v82.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias v82 --out lab/out/premium-UAE_ENHANCED_V8.2.apk lab/out/Premium_UAE_V82_aligned.apk
          "$BT/apksigner" verify --verbose --print-certs lab/out/premium-UAE_ENHANCED_V8.2.apk | tee lab/out/signature.txt
          sha256sum lab/out/premium-UAE_ENHANCED_V8.2.apk > lab/out/SHA256SUMS.txt

      - name: Android 12 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb wait-for-device
            sleep 25
            adb shell service check package | grep -qi found
            adb push lab/out/premium-UAE_ENHANCED_V8.2.apk /data/local/tmp/v82.apk
            adb shell pm install -r /data/local/tmp/v82.apk || { sleep 15; adb shell pm list packages >/dev/null; adb shell pm install -r /data/local/tmp/v82.apk; }
            adb logcat -c
            adb shell monkey -p com.mbm_soft.aldahyaplay -c android.intent.category.LAUNCHER 1 || true
            sleep 12
            adb shell pidof com.mbm_soft.aldahyaplay > lab/out/pid.txt || true
            test -s lab/out/pid.txt
            adb logcat -d > lab/out/logcat.txt
            grep -A12 -B4 -E 'AndroidRuntime.*Process: com\.mbm_soft\.aldahyaplay|FATAL EXCEPTION.*com\.mbm_soft\.aldahyaplay' lab/out/logcat.txt > lab/out/app-fatal.txt || true
            test ! -s lab/out/app-fatal.txt
            echo ANDROID12_V82_SMOKE_OK > lab/out/emulator-result.txt

      - name: Upload V8.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-UAE-Enhanced-V8.2
          path: |
            lab/out/premium-UAE_ENHANCED_V8.2.apk
            lab/out/patch-result.txt
            lab/out/search-scenarios.txt
            lab/out/activity_intro_v82.xml
            lab/out/zip-test.txt
            lab/out/signature.txt
            lab/out/SHA256SUMS.txt
            lab/out/pid.txt
            lab/out/logcat.txt
            lab/out/app-fatal.txt
            lab/out/emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
