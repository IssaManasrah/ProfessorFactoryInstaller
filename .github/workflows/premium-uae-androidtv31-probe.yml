name: Android TV 31 Probe
on:
  push:
    branches: [premium-uae-v8-lab]
    paths: ['.github/workflows/premium-uae-androidtv31-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86_64
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.characteristics
            echo ANDROID_TV_31_OK
