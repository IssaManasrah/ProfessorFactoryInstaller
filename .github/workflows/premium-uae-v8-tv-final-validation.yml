name: Premium UAE V8 TV Final Validation

on:
  push:
    branches: [premium-uae-v8-lab]
    paths: ['.github/workflows/premium-uae-v8-tv-final-validation.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tv-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download already-built V8 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p lab/src lab/tools lab/out
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -o lab/v8.zip 'https://api.github.com/repos/IssaManasrah/ProfessorFactoryInstaller/actions/artifacts/9253511622/zip'
          unzip -q lab/v8.zip -d lab/src
          find lab/src -maxdepth 2 -type f -printf '%p\n' | sort
          cp lab/src/Premium_UAE_V8.apk lab/out/Premium_UAE_V8.apk
          curl -fL --retry 3 -o lab/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'

      - name: Build test-only APK from exact V8 APK
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar d -f lab/out/Premium_UAE_V8.apk -o lab/decoded
          cat > lab/decoded/smali/com/mbm_soft/aldahyaplay/utils/ResumeDialogTestActivity.smali <<'SMALI'
          .class public Lcom/mbm_soft/aldahyaplay/utils/ResumeDialogTestActivity;
          .super Landroid/app/Activity;
          .source "ResumeDialogTestActivity.java"

          .method public constructor <init>()V
              .locals 0
              invoke-direct {p0}, Landroid/app/Activity;-><init>()V
              return-void
          .end method

          .method protected onCreate(Landroid/os/Bundle;)V
              .locals 0
              invoke-super {p0, p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V
              invoke-static {p0}, Lcom/mbm_soft/aldahyaplay/utils/ResumePrompt;->showTest(Landroid/app/Activity;)V
              return-void
          .end method
          SMALI
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab/decoded/AndroidManifest.xml')
          s=p.read_text()
          assert '</application>' in s
          s=s.replace('</application>','<activity android:name="com.mbm_soft.aldahyaplay.utils.ResumeDialogTestActivity" android:exported="true" />\n</application>',1)
          p.write_text(s)
          PY
          java -jar lab/tools/apktool.jar b lab/decoded -o lab/out/V8_TVTEST_unsigned.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore lab/out/tvtest.keystore -storepass android -keypass android -alias tvtest -dname 'CN=Premium UAE V8 TV Test,O=Professor,C=JO' -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f 4 lab/out/V8_TVTEST_unsigned.apk lab/out/V8_TVTEST_aligned.apk
          "$BT/apksigner" sign --ks lab/out/tvtest.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias tvtest --out lab/out/V8_TVTEST.apk lab/out/V8_TVTEST_aligned.apk
          "$BT/apksigner" verify --verbose lab/out/V8_TVTEST.apk

      - name: Android 12 TV DPAD + final APK smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86_64
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            sleep 15
            adb shell service check package | grep -qi found
            adb install --no-incremental -r lab/out/V8_TVTEST.apk
            adb shell am start -n com.mbm_soft.aldahyaplay/com.mbm_soft.aldahyaplay.utils.ResumeDialogTestActivity
            sleep 3
            adb shell uiautomator dump /sdcard/v8-initial.xml >/dev/null
            adb pull /sdcard/v8-initial.xml lab/out/v8-initial.xml >/dev/null
            python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('lab/out/v8-initial.xml').getroot(); n=[x for x in r.iter('node') if x.attrib.get('text')=='متابعة']; assert n and n[0].attrib.get('focused')=='true', n[0].attrib if n else 'missing'; print('INITIAL_FOCUS_CONTINUE_OK')" | tee lab/out/dpad-test.txt
            adb exec-out screencap -p > lab/out/resume-dialog-initial.png
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            adb shell uiautomator dump /sdcard/v8-right.xml >/dev/null
            adb pull /sdcard/v8-right.xml lab/out/v8-right.xml >/dev/null
            python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('lab/out/v8-right.xml').getroot(); n=[x for x in r.iter('node') if x.attrib.get('text')=='من البداية']; assert n and n[0].attrib.get('focused')=='true', n[0].attrib if n else 'missing'; print('DPAD_RIGHT_RESTART_OK')" | tee -a lab/out/dpad-test.txt
            adb exec-out screencap -p > lab/out/resume-dialog-right.png
            adb shell input keyevent KEYCODE_DPAD_LEFT
            sleep 1
            adb shell uiautomator dump /sdcard/v8-left.xml >/dev/null
            adb pull /sdcard/v8-left.xml lab/out/v8-left.xml >/dev/null
            python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('lab/out/v8-left.xml').getroot(); n=[x for x in r.iter('node') if x.attrib.get('text')=='متابعة']; assert n and n[0].attrib.get('focused')=='true', n[0].attrib if n else 'missing'; print('DPAD_LEFT_CONTINUE_OK')" | tee -a lab/out/dpad-test.txt
            adb exec-out screencap -p > lab/out/resume-dialog-left.png
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 1
            echo DPAD_CENTER_CLICK_OK | tee -a lab/out/dpad-test.txt
            adb uninstall com.mbm_soft.aldahyaplay || true
            adb install --no-incremental lab/out/Premium_UAE_V8.apk
            adb logcat -c
            adb shell monkey -p com.mbm_soft.aldahyaplay -c android.intent.category.LAUNCHER 1 || true
            sleep 12
            adb shell pidof com.mbm_soft.aldahyaplay > lab/out/emulator-pid.txt || true
            test -s lab/out/emulator-pid.txt
            adb logcat -d > lab/out/emulator-logcat.txt
            grep -A12 -B4 -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.mbm_soft\.aldahyaplay' lab/out/emulator-logcat.txt > lab/out/fatal-check.txt || true
            test ! -s lab/out/fatal-check.txt
            adb shell getprop ro.build.version.release > lab/out/android-release.txt
            adb shell getprop ro.build.characteristics > lab/out/android-characteristics.txt
            echo ANDROID12_TV_DPAD_AND_FINAL_SMOKE_OK > lab/out/result.txt

      - name: Upload TV validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-UAE-V8-TV-Validation
          path: |
            lab/out/dpad-test.txt
            lab/out/resume-dialog-initial.png
            lab/out/resume-dialog-right.png
            lab/out/resume-dialog-left.png
            lab/out/v8-initial.xml
            lab/out/v8-right.xml
            lab/out/v8-left.xml
            lab/out/emulator-pid.txt
            lab/out/emulator-logcat.txt
            lab/out/fatal-check.txt
            lab/out/android-release.txt
            lab/out/android-characteristics.txt
            lab/out/result.txt
          if-no-files-found: warn
          retention-days: 7
