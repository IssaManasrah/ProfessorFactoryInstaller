name: Premium UAE V7

on:
  push:
    branches: [premium-uae-v7-lab]
    paths:
      - '.github/workflows/premium-uae-v7.yml'
      - 'premium-uae-lab/v7/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download UAE APK and apktool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p lab/tools lab/out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          curl -fL --retry 3 -A "$UA" -H 'Accept: */*' -e 'https://professorsat.com/' -o lab/premium-UAE.apk 'https://professorsat.com/store/models/UAE%20Apps/premium-UAE.apk'
          curl -fL --retry 3 -o lab/tools/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          sha256sum lab/premium-UAE.apk > lab/out/SHA256SUMS.txt

      - name: Decode UAE APK
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar d -f lab/premium-UAE.apk -o lab/decoded-uae

      - name: Apply V4 VNext V5 V6 V7 patches
        shell: bash
        run: |
          set -euxo pipefail
          python3 premium-uae-lab/patch_uae.py lab/decoded-uae | tee lab/out/patch-result.txt
          python3 premium-uae-lab/fix_ranges.py lab/decoded-uae | tee -a lab/out/patch-result.txt
          cat premium-uae-lab/vnext_parts/part00 premium-uae-lab/vnext_parts/part01 premium-uae-lab/vnext_parts/part02 premium-uae-lab/vnext_parts/part03 premium-uae-lab/vnext_parts/part04a premium-uae-lab/vnext_parts/part04b0 premium-uae-lab/vnext_parts/part04b1 premium-uae-lab/vnext_parts/part04b2 premium-uae-lab/vnext_parts/part05 > lab/patch_vnext.py.gz.b64
          base64 -d lab/patch_vnext.py.gz.b64 | gzip -d > lab/patch_vnext.py
          python3 lab/patch_vnext.py lab/decoded-uae | tee -a lab/out/patch-result.txt
          base64 -d premium-uae-lab/v5/patch_v5.py.gz.b64 | gzip -d > lab/patch_v5.py
          python3 lab/patch_v5.py lab/decoded-uae | tee -a lab/out/patch-result.txt
          base64 -d premium-uae-lab/v6/patch_v6.py.gz.b64 | gzip -d > lab/patch_v6.py
          python3 lab/patch_v6.py lab/decoded-uae | tee -a lab/out/patch-result.txt
          base64 -d premium-uae-lab/v7/patch_v7.py.gz.b64 | gzip -d > lab/patch_v7.py
          python3 -m py_compile lab/patch_v7.py
          python3 lab/patch_v7.py lab/decoded-uae | tee -a lab/out/patch-result.txt
          grep -q 'V7_PATCH_OK' lab/out/patch-result.txt

      - name: Verify V7 search scenarios and resume wiring
        shell: bash
        run: |
          set -euxo pipefail
          APP=lab/decoded-uae/smali/com/mbm_soft/aldahyaplay
          grep -q 'System;->nanoTime()J' "$APP/ui/movies/d.smali"
          grep -q 'System;->nanoTime()J' "$APP/ui/series/d.smali"
          grep -q 'Lw6/f;->W(Ljava/util/List;)V' "$APP/ui/movies/d.smali"
          grep -q 'Lw6/f;->Q0(Ljava/util/List;)V' "$APP/ui/series/d.smali"
          grep -q 'const-string v6, "resume_key"' "$APP/ui/movie_info/MovieInfoActivity.smali"
          grep -q 'const-string v5, "resume_key"' "$APP/ui/series_info/SeriesInfoActivity\$b.smali"
          grep -q 'resolveKey(Landroid/app/Activity;)Ljava/lang/String;' "$APP/utils/ResumeStore.smali"
          grep -q 'SharedPreferences\$Editor;->commit()Z' "$APP/utils/ResumeStore.smali"
          grep -q 'styleDialog(Landroid/app/AlertDialog;)V' "$APP/utils/ResumePrompt.smali"
          grep -q -- '-0xd182ce' "$APP/utils/ResumePrompt.smali"
          grep -q -- '-0xbdbdbe' "$APP/utils/ResumePrompt.smali"
          python3 - <<'PY' | tee lab/out/search-scenarios.txt
          import time
          class SearchState:
              def __init__(self): self.token=''
              def search(self,q):
                  self.token=f'{q}#{time.monotonic_ns()}'
                  return self.token
              def clear(self): self.token=''
              def accepts(self,t): return bool(self.token) and t==self.token
          s=SearchState()
          a1=s.search('series')
          assert s.accepts(a1)
          s.clear()
          assert not s.accepts(a1)
          a2=s.search('series')
          assert a2 != a1 and s.accepts(a2)
          assert not s.accepts(a1)
          b=s.search('series2')
          assert s.accepts(b) and not s.accepts(a2)
          s.clear()
          assert not s.accepts(b)
          c=s.search('series')
          assert c not in (a1,a2) and s.accepts(c)
          print('SCENARIO_1 type -> result: PASS')
          print('SCENARIO_2 clear -> same term -> new result token: PASS')
          print('SCENARIO_3 fast second query rejects old callback: PASS')
          print('SCENARIO_4 clear rejects late callback and allows new search: PASS')
          PY
          {
            echo 'MOVIE_RESUME_KEY:'; grep -n 'resume_key' "$APP/ui/movie_info/MovieInfoActivity.smali";
            echo 'SERIES_RESUME_KEY:'; grep -n 'resume_key' "$APP/ui/series_info/SeriesInfoActivity\$b.smali";
            echo 'PLAYER_RESOLVE:'; grep -R -n 'ResumeStore;->resolveKey' "$APP/ui/vod_exo" "$APP/ui/vod_vlc";
            echo 'SYNC_COMMIT:'; grep -n 'Editor;->commit()Z' "$APP/utils/ResumeStore.smali";
            echo 'DIALOG_STYLE:'; grep -n -E 'styleDialog|0xd182ce|0xbdbdbe|0xdfdfe0' "$APP/utils/ResumePrompt.smali";
          } > lab/out/v7-wiring.txt

      - name: Rebuild patched UAE APK
        shell: bash
        run: |
          set -euxo pipefail
          java -jar lab/tools/apktool.jar b lab/decoded-uae -o lab/out/Premium_UAE_V7_unsigned.apk
          unzip -t lab/out/Premium_UAE_V7_unsigned.apk > lab/out/rebuild-zip-test.txt

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore lab/out/lab.keystore -storepass android -keypass android -alias premiumuae -dname 'CN=Premium UAE V7,O=Professor,C=JO' -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f 4 lab/out/Premium_UAE_V7_unsigned.apk lab/out/Premium_UAE_V7_aligned.apk
          "$BT/apksigner" sign --ks lab/out/lab.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias premiumuae --out lab/out/Premium_UAE_V7.apk lab/out/Premium_UAE_V7_aligned.apk
          "$BT/apksigner" verify --verbose --print-certs lab/out/Premium_UAE_V7.apk | tee lab/out/apksigner-verify.txt

      - name: Android 11 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            sleep 20
            adb shell service check package | grep -qi 'found'
            adb shell pm list packages >/dev/null
            sleep 5
            adb install --no-incremental -r lab/out/Premium_UAE_V7.apk
            adb logcat -c
            adb shell monkey -p com.mbm_soft.aldahyaplay -c android.intent.category.LAUNCHER 1 || true
            sleep 12
            adb shell pidof com.mbm_soft.aldahyaplay > lab/out/emulator-pid.txt || true
            test -s lab/out/emulator-pid.txt
            adb logcat -d > lab/out/emulator-logcat.txt
            grep -A12 -B4 -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.mbm_soft\.aldahyaplay' lab/out/emulator-logcat.txt > lab/out/fatal-check.txt || true
            test ! -s lab/out/fatal-check.txt
            echo 'EMULATOR_SMOKE_OK' > lab/out/emulator-result.txt

      - name: Upload V7 APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-UAE-Enhanced-V7
          path: |
            lab/out/Premium_UAE_V7.apk
            lab/out/patch-result.txt
            lab/out/search-scenarios.txt
            lab/out/v7-wiring.txt
            lab/out/apksigner-verify.txt
            lab/out/rebuild-zip-test.txt
            lab/out/emulator-result.txt
            lab/out/emulator-pid.txt
            lab/out/emulator-logcat.txt
            lab/out/fatal-check.txt
            lab/out/SHA256SUMS.txt
          retention-days: 7
