<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHAKO | شاكو</title>
<style>
:root{--blue:#0b5fff;--blue2:#0a3ca7;--bg:#f4f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e6eaf0;--green:#0f9d58;--red:#d93025}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Arabic",sans-serif;color:var(--text)}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--blue2),var(--blue));color:white;padding:18px 16px 16px;box-shadow:0 3px 16px #0002}.brand{display:flex;align-items:center;justify-content:space-between}.logo{font-size:27px;font-weight:900;letter-spacing:.4px}.sub{font-size:12px;opacity:.9;margin-top:3px}.status{font-size:11px;background:#ffffff20;border:1px solid #ffffff55;padding:7px 10px;border-radius:999px}.search{display:flex;gap:8px;margin-top:15px}.search input{width:100%;border:0;border-radius:14px;padding:13px 14px;font-size:15px;outline:none}.search button{border:0;background:white;color:var(--blue);font-weight:800;border-radius:14px;padding:0 16px}
.wrap{padding:14px 14px 92px}.hero{background:#0b5fff;color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 8px 30px #0b5fff2e}.hero h1{font-size:24px;margin:0 0 8px}.hero p{margin:0;line-height:1.7;font-size:14px;opacity:.95}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.sectionTitle h2{font-size:18px;margin:0}.sectionTitle span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;padding:9px 13px;border-radius:999px;font-size:13px}.chip.active{background:var(--blue);border-color:var(--blue);color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 3px 14px #0000000a}.imgWrap{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px}.imgWrap img{max-width:100%;max-height:100%;object-fit:contain}.info{padding:11px}.name{font-weight:800;font-size:14px;line-height:1.45;height:41px;overflow:hidden}.meta{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.priceRow{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.price{font-weight:900;color:var(--blue);font-size:17px}.old{font-size:11px;color:#9ca3af;text-decoration:line-through}.badge{font-size:10px;border-radius:999px;padding:5px 7px;background:#e9f8ef;color:var(--green);font-weight:700}.badge.off{background:#fdecec;color:var(--red)}.btn{width:100%;border:0;border-radius:11px;padding:9px;margin-top:9px;background:#eef4ff;color:var(--blue);font-weight:800}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}.loading{padding:28px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #0001}.nav{border:0;background:transparent;padding:8px 2px;color:var(--muted);font-size:11px;font-weight:700}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--blue)}
.modal{position:fixed;inset:0;background:#0008;display:none;z-index:50;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:white;border-radius:24px 24px 0 0;padding:16px}.sheetTop{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;padding-bottom:8px}.close{border:0;background:#f1f3f6;border-radius:50%;width:38px;height:38px;font-size:18px}.detailImg{width:100%;height:260px;object-fit:contain;background:#fafafa;border-radius:18px}.detailName{font-size:22px;font-weight:900;margin:15px 0 6px}.detailPrice{font-size:24px;font-weight:900;color:var(--blue)}.desc{font-size:14px;line-height:1.9;color:#374151}.buy{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:white;padding:14px;font-size:16px;font-weight:900;margin-top:12px}.note{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.ai{display:flex;flex-direction:column;min-height:calc(100vh - 188px)}.aiHead{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}.aiTitle{font-size:22px;font-weight:900;color:var(--blue)}.aiSub{font-size:12px;color:var(--muted);margin-top:4px}.chat{display:flex;flex-direction:column;gap:8px;flex:1}.msg{max-width:88%;padding:12px 14px;border-radius:17px;line-height:1.65;font-size:14px;white-space:pre-wrap;word-break:break-word}.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-right-radius:5px}.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-left-radius:5px}.thinking{align-self:flex-start;color:var(--muted);font-size:12px;padding:8px 4px}.composer{position:sticky;bottom:67px;background:var(--bg);padding:10px 0 3px;display:flex;gap:8px}.composer input{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:15px;outline:none}.composer button{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:0 17px;font-weight:900}.aiWelcome{font-weight:800}.hidden{display:none!important}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{max-width:1000px;margin:auto}.top>div{max-width:1000px;margin:auto}.msg{max-width:70%}}
</style>
</head>
<body>
<header class="top"><div><div class="brand"><div><div class="logo">شاكو SHAKO</div><div class="sub">متصل مباشرة بمتجر شيخ الكار</div></div><div id="status" class="status">جاري الاتصال...</div></div><div id="searchBar" class="search"><input id="searchInput" placeholder="ابحث عن منتج..."><button onclick="doSearch()">بحث</button></div></div></header>
<main class="wrap"><section id="hero" class="hero"><h1>كل منتجات شيخ الكار في شاكو</h1><p>الأسعار والصور والمخزون تأتي مباشرة من الموقع الحالي.</p></section><div id="content"><div class="loading">جاري تحميل المنتجات...</div></div></main>
<nav class="bottom"><button id="navHome" class="nav active" onclick="showHome()"><b>⌂</b>الرئيسية</button><button id="navProducts" class="nav" onclick="showProducts()"><b>▦</b>المنتجات</button><button id="navCategories" class="nav" onclick="showCategories()"><b>☷</b>الأقسام</button><button id="navShako" class="nav" onclick="showAssistant()"><b>✦</b>شاكو</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheetTop"><strong>تفاصيل المنتج</strong><button class="close" onclick="closeModal()">×</button></div><div id="detail"></div></div></div>
<script>
let cats=[],activeCat=0,lastProducts=[],chatStarted=false,assistantBusy=false;
function safeParse(s){try{return JSON.parse(s)}catch(e){return {ok:false,error:'invalid_json'}}}
function api(name,...args){try{if(!window.ShakoApi)return {ok:false,error:'bridge_missing'};return safeParse(window.ShakoApi[name](...args))}catch(e){return {ok:false,error:String(e)}}}
function money(v){return (Number(v||0)%1===0?Number(v||0).toFixed(0):Number(v||0).toFixed(2))+' د.أ'}
function strip(s){let d=document.createElement('div');d.innerHTML=s||'';return (d.textContent||'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setNav(id){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function showSearch(show){document.getElementById('searchBar').classList.toggle('hidden',!show)}
function checkHealth(){let h=api('health');let s=document.getElementById('status');if(h.ok){s.textContent='● متصل بالموقع';s.style.background='#14a44d55'}else{s.textContent='غير متصل';s.style.background='#d9302555'}}
function loadCats(){let r=api('categories');cats=r.ok?(r.categories||[]):[]}
function catChips(){let html='<div class="chips"><button class="chip '+(activeCat===0?'active':'')+'" onclick="pickCat(0)">الكل</button>';cats.forEach(c=>{html+='<button class="chip '+(activeCat===Number(c.id)?'active':'')+'" onclick="pickCat('+Number(c.id)+')">'+esc(c.name)+'</button>'});return html+'</div>'}
function productCard(p){let old=Number(p.price_before_discount||0)>Number(p.price||0)?'<span class="old">'+money(p.price_before_discount)+'</span>':'';return '<article class="card"><div class="imgWrap"><img loading="lazy" src="'+esc(p.image_url||'')+'" onerror="this.style.opacity=.15"></div><div class="info"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.category_name||'')+'</div><div class="priceRow"><div><div class="price">'+money(p.price)+'</div>'+old+'</div><span class="badge '+(p.available?'':'off')+'">'+(p.available?'متوفر':'غير متوفر')+'</span></div><button class="btn" onclick="openProduct('+Number(p.id)+')">عرض المنتج</button></div></article>'}
function renderProducts(title,items,withCats=true){lastProducts=items||[];let html='<div class="sectionTitle"><h2>'+esc(title)+'</h2><span>'+lastProducts.length+' منتج</span></div>';if(withCats)html+=catChips();html+=lastProducts.length?'<div class="grid">'+lastProducts.map(productCard).join('')+'</div>':'<div class="empty">لا توجد منتجات</div>';document.getElementById('content').innerHTML=html}
function showHome(){setNav('navHome');showSearch(true);activeCat=0;document.getElementById('hero').style.display='block';let r=api('home');if(r.ok){if(!cats.length)cats=r.categories||[];renderProducts('أحدث المنتجات',r.latest_products||[],true)}else showProducts()}
function showProducts(q=''){setNav('navProducts');showSearch(true);document.getElementById('hero').style.display='none';document.getElementById('content').innerHTML='<div class="loading">جاري تحميل المنتجات...</div>';setTimeout(()=>{let r=api('products',1,24,q||'',activeCat||0);if(r.ok)renderProducts(q?'نتائج البحث':'كل المنتجات',r.items||[],true);else document.getElementById('content').innerHTML='<div class="empty">تعذر تحميل المنتجات</div>'},30)}
function showCategories(){setNav('navCategories');showSearch(true);document.getElementById('hero').style.display='none';if(!cats.length)loadCats();let html='<div class="sectionTitle"><h2>الأقسام</h2><span>'+cats.length+' قسم</span></div><div class="grid">';cats.forEach(c=>{html+='<article class="card" onclick="pickCat('+Number(c.id)+')"><div class="imgWrap"><img src="'+esc(c.image_url||'')+'" onerror="this.style.opacity=.15"></div><div class="info"><div class="name" style="height:auto;text-align:center">'+esc(c.name)+'</div></div></article>'});html+='</div>';document.getElementById('content').innerHTML=html}
function pickCat(id){activeCat=Number(id)||0;showProducts('')}
function doSearch(){activeCat=0;showProducts(document.getElementById('searchInput').value.trim())}
function openProduct(id){document.getElementById('modal').classList.add('open');document.getElementById('detail').innerHTML='<div class="loading">جاري تحميل التفاصيل...</div>';setTimeout(()=>{let r=api('product',Number(id));if(!r.ok||!r.product){document.getElementById('detail').innerHTML='<div class="empty">تعذر تحميل المنتج</div>';return}let p=r.product;document.getElementById('detail').innerHTML='<img class="detailImg" src="'+esc((p.images&&p.images[0])||p.image_url||'')+'"><div class="detailName">'+esc(p.name)+'</div><div class="detailPrice">'+money(p.price)+'</div><div class="desc">'+(p.short_description||'')+'</div><button class="buy" onclick="ShakoApi.openUrl(\''+String(p.url||'').replace(/'/g,"%27")+'\')">شراء من شيخ الكار</button><div class="note">السلة والطلب داخل شاكو سيتم تفعيلهما في المرحلة التالية.</div>'},20)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function showAssistant(){setNav('navShako');showSearch(false);document.getElementById('hero').style.display='none';document.getElementById('content').innerHTML='<section class="ai"><div class="aiHead"><div class="aiTitle">شاكو</div><div class="aiSub">مساعدك الذكي داخل تطبيق شاكو</div></div><div id="chat" class="chat"></div><div class="composer"><input id="aiInput" placeholder="اكتب لِشاكو..." autocomplete="off"><button id="aiSend" onclick="sendAssistant()">إرسال</button></div></section>';if(!chatStarted){chatStarted=true;addMsg('bot','أهلًا 👋 أنا شاكو. احكيلي شو بدك وأنا أساعدك.')}document.getElementById('aiInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendAssistant()});document.getElementById('aiInput').focus()}
function addMsg(type,text){let chat=document.getElementById('chat');if(!chat)return;let d=document.createElement('div');d.className='msg '+type;d.textContent=text;chat.appendChild(d);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function sendAssistant(){if(assistantBusy)return;let input=document.getElementById('aiInput');if(!input)return;let q=input.value.trim();if(!q)return;addMsg('user',q);input.value='';assistantBusy=true;let chat=document.getElementById('chat');let wait=document.createElement('div');wait.id='aiThinking';wait.className='thinking';wait.textContent='شاكو يكتب...';chat.appendChild(wait);document.getElementById('aiSend').disabled=true;setTimeout(()=>{let r=api('assistant',q);let t=document.getElementById('aiThinking');if(t)t.remove();assistantBusy=false;let b=document.getElementById('aiSend');if(b)b.disabled=false;if(r.ok&&r.answer){addMsg('bot',r.answer)}else{addMsg('bot',r.message||'تعذر الوصول إلى شاكو الآن. حاول مرة ثانية.')};let i=document.getElementById('aiInput');if(i)i.focus()},40)}
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
window.onload=()=>{checkHealth();loadCats();showHome()}
</script>
</body>
</html>
