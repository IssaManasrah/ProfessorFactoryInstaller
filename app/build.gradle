plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaikhalkar.professorinstaller'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shaikhalkar.professorinstaller.autoclick'
        minSdk 26
        targetSdk 35
        versionCode 3101
        versionName '3.1.0-auto-click-fresh'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Fresh validation package id so it can install beside older test builds.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
