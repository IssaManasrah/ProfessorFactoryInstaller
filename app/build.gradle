plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaikhalkar.professorinstaller'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shaikhalkar.professorinstaller'
        minSdk 26
        targetSdk 35
        versionCode 103
        versionName '3.1.0-auto-click'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Keep the production package id so the Android TV tested APK follows
            // the exact same package path used on real devices.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
