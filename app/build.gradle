plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaikhalkar.professorinstaller'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shaikhalkar.professorinstaller.sharedfix'
        minSdk 26
        targetSdk 35
        versionCode 3111
        versionName '3.1.1-shared-user-fix-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Side-by-side validation package so the working build stays installed.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
