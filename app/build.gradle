plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaikhalkar.professorinstaller'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shaikhalkar.professorinstaller'
        minSdk 26
        targetSdk 35
        versionCode 101
        versionName '3.0.1-install-flow'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
